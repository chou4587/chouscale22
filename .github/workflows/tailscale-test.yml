name: Tailscale Exit Test

on:
  schedule:
    - cron: "30 12 * * *"
      timezone: "Asia/Shanghai"
    - cron: "00 13 * * *"
      timezone: "Asia/Shanghai"
    - cron: "30 13 * * *"
      timezone: "Asia/Shanghai"
    - cron: "00 14 * * *"
      timezone: "Asia/Shanghai"
    - cron: "30 14 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

concurrency:
  group: tailscale-exit-test
  cancel-in-progress: true

jobs:
  exit-node-test:
    runs-on: ubuntu-latest

    steps:

      - name: Install Tailscale
        if: github.event.schedule != '30 14 * * *'
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale Exit Node
        if: github.event.schedule != '30 14 * * *'
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --advertise-exit-node \
            --accept-dns=false \
            --hostname=github-exit-node

      - name: Enable IP forwarding and NAT
        if: github.event.schedule != '30 14 * * *'
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

          IFACE=$(ip route | grep default | awk '{print $5}')

          sudo iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i tailscale0 -j ACCEPT
          sudo iptables -A FORWARD -o tailscale0 -j ACCEPT

      - name: Keep alive
        if: github.event.schedule != '30 14 * * *'
        run: |
          sleep 21600

      - name: Cleanup Tailscale
        if: always() && github.event.schedule != '30 14 * * *'
        run: |
          sudo tailscale logout || true
