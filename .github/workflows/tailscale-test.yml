name: Tailscale Exit Handoff Test

on:
  schedule:
    # 北京时间 19:30：第一次启动
    - cron: "30 19 * * *"
      timezone: "Asia/Shanghai"

    # 北京时间 19:45：第二次启动
    - cron: "45 19 * * *"
      timezone: "Asia/Shanghai"

  workflow_dispatch:

jobs:
  exit-node-test:
    runs-on: ubuntu-latest

    steps:

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --advertise-exit-node \
            --accept-dns=false \
            --hostname=github-exit-test

      - name: Enable forwarding and NAT
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

          IFACE=$(ip route | grep default | awk '{print $5}' | head -1)

          sudo iptables -t nat -A POSTROUTING \
            -o "$IFACE" \
            -j MASQUERADE

          sudo iptables -A FORWARD \
            -i tailscale0 \
            -j ACCEPT

          sudo iptables -A FORWARD \
            -o tailscale0 \
            -j ACCEPT

      - name: Show Exit Node status
        run: |
          echo "===== Tailscale status ====="
          sudo tailscale status
          echo
          echo "===== Tailscale IP ====="
          sudo tailscale ip
          echo
          echo "===== Current time ====="
          date

      - name: Keep alive for 10 minutes
        run: |
          echo "Test Exit Node is active."
          echo "It will logout after 10 minutes."
          sleep 600

      - name: Graceful logout
        if: always()
        run: |
          echo "===== Logging out test Exit Node ====="
          sudo tailscale logout || true
          echo "===== Final Tailscale status ====="
          sudo tailscale status || true
          date
