# Tailscale Exit Handoff Test
# Created: 2026-09-07 16:39 (UTC+8)
# Total lines: 791

name: Tailscale Exit Handoff Test

on:
  workflow_dispatch:
    inputs:
      pairing_mode:
        description: "首次配对选择 pair（通过 Tailscale SSH 完成）；以后正常运行选择 normal"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - pair
      pairing_code:
        description: "旧版配对流程兼容项；SSH 配对方案不要填写"
        required: false
        type: string
permissions:
  contents: read
  actions: write

concurrency:
  group: hermes-exit-handoff-test
  cancel-in-progress: false

jobs:
  exit-node-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --advertise-exit-node \
            --accept-dns=false \
            --hostname=github-exit-test

      - name: Enable forwarding, NAT, and Tailscale SSH
        run: |
          set -e
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo sysctl -w net.ipv6.conf.all.forwarding=1 >/dev/null
          IFACE=$(ip route | awk '/default/ {print $5; exit}')
          sudo iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i tailscale0 -j ACCEPT
          sudo iptables -A FORWARD -o tailscale0 -j ACCEPT

          # Tailscale SSH uses TCP/22 on the Tailscale IP only.
          sudo tailscale set --ssh
          echo "SSH user: $(whoami)"
          echo "SSH command: ssh $(whoami)@$(sudo tailscale ip -4)"

      - name: Install Hermes
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --branch v2026.8.31 >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          hermes --version >/dev/null

      - name: Restore Hermes data
        if: ${{ inputs.pairing_mode != 'pair' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEIXIN_BACKUP_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          PAIRING_MODE: ${{ inputs.pairing_mode }}
          HAS_PAIRING_CODE: ${{ inputs.pairing_code != '' }}
        run: |
          set -euo pipefail
          rm -rf /tmp/hermes-restore
          mkdir -p /tmp/hermes-restore

          if [ "$PAIRING_MODE" = "pair" ]; then
            RESTORE_PREFIX="hermes-approved-"
            LEGACY_FALLBACK=1
          elif [ "$HAS_PAIRING_CODE" = "true" ]; then
            RESTORE_PREFIX="hermes-pair-pending-"
            LEGACY_FALLBACK=0
          else
            RESTORE_PREFIX="hermes-approved-"
            LEGACY_FALLBACK=1
          fi
          export RESTORE_PREFIX

          gh api --paginate             "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"             --jq '
              .artifacts[]
              | select(.expired == false and (.name | startswith(env.RESTORE_PREFIX)))
              | [.created_at, .id]
              | @tsv
            ' 2>/dev/null | sort -r | cut -f2 > /tmp/hermes-artifact-ids || true

          if [ "$LEGACY_FALLBACK" -eq 1 ]; then
            gh api --paginate               "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"               --jq '
                .artifacts[]
                | select(.expired == false and (.name == "hermes-persistent-data" or (.name | startswith("hermes-persistent-data-"))))
                | [.created_at, .id]
                | @tsv
              ' 2>/dev/null | sort -r | cut -f2 >> /tmp/hermes-artifact-ids || true
          fi

          FOUND=0
          while read -r ID; do
            [ -n "$ID" ] || continue
            rm -rf /tmp/hermes-restore/*
            rm -f /tmp/hermes.zip /tmp/weixin.env /tmp/weixin-credentials.tar.gz
            mkdir -p /tmp/hermes-restore/data /tmp/hermes-restore/zip

            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/hermes.zip 2>/dev/null || continue
            unzip -q /tmp/hermes.zip -d /tmp/hermes-restore/zip 2>/dev/null || continue
            [ -f /tmp/hermes-restore/zip/hermes-data.tar.gz ] || continue
            tar -xzf /tmp/hermes-restore/zip/hermes-data.tar.gz -C /tmp/hermes-restore/data 2>/dev/null || continue

            if [ "$HAS_PAIRING_CODE" = "true" ]; then
              [ -f /tmp/hermes-restore/data/state-manifest ] || continue
              grep -qx 'state=pair-pending' /tmp/hermes-restore/data/state-manifest || continue
            elif [ -f /tmp/hermes-restore/data/state-manifest ]; then
              grep -qx 'state=approved' /tmp/hermes-restore/data/state-manifest || continue
            fi

            [ -f /tmp/hermes-restore/data/weixin-env.enc ] || continue
            openssl enc -d -aes-256-cbc -pbkdf2               -pass env:WEIXIN_BACKUP_KEY               -in /tmp/hermes-restore/data/weixin-env.enc               -out /tmp/weixin.env 2>/dev/null || continue
            grep -q '^WEIXIN_ACCOUNT_ID=.[^[:space:]]*' /tmp/weixin.env || continue
            grep -q '^WEIXIN_TOKEN=.[^[:space:]]*' /tmp/weixin.env || continue
            [ -d /tmp/hermes-restore/data/.hermes ] || continue

            rm -rf "$HOME/.hermes"
            cp -a /tmp/hermes-restore/data/.hermes "$HOME/.hermes"

            if [ -f /tmp/hermes-restore/data/weixin-credentials.enc ]; then
              openssl enc -d -aes-256-cbc -pbkdf2                 -pass env:WEIXIN_BACKUP_KEY                 -in /tmp/hermes-restore/data/weixin-credentials.enc                 -out /tmp/weixin-credentials.tar.gz 2>/dev/null || continue
              tar -xzf /tmp/weixin-credentials.tar.gz -C "$HOME" 2>/dev/null || continue
            fi

            FOUND=1
            echo "Restored Hermes data from artifact $ID."
            break
          done < /tmp/hermes-artifact-ids

          rm -f /tmp/hermes-artifact-ids

          if [ "$FOUND" -ne 1 ]; then
            if [ "$HAS_PAIRING_CODE" = "true" ]; then
              echo "ERROR: No hermes-pair-pending artifact was found."
            else
              echo "ERROR: No approved Hermes backup containing valid Weixin credentials was found."
            fi
            exit 1
          fi

          rm -rf /tmp/hermes-restore /tmp/hermes.zip /tmp/weixin-credentials.tar.gz

      - name: Install Dashboard and Weixin dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          cd "$HOME/.hermes/hermes-agent"
          uv pip install --python ./venv/bin/python -e ".[web,pty]" >/dev/null 2>&1
          uv pip install --python ./venv/bin/python aiohttp cryptography qrcode >/dev/null 2>&1

      - name: Configure Hermes
        run: |
          mkdir -p "$HOME/.hermes"

          cat > "$HOME/.hermes/.env" <<'EOF'
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=hermes123456
          EOF

          if [ -f /tmp/weixin.env ]; then
            cat /tmp/weixin.env >> "$HOME/.hermes/.env"
            rm -f /tmp/weixin.env
          fi

          chmod 600 "$HOME/.hermes/.env"

      - name: Install save tools
        env:
          WEIXIN_BACKUP_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq rsync
          fi

          cat > "$HOME/save-hermes.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          export WEIXIN_BACKUP_KEY="$(cat "$HOME/.weixin-backup-key")"

          STATE="${1:-approved}"
          case "$STATE" in
            approved|pair-pending) ;;
            *) echo "ERROR: invalid backup state: $STATE" >&2; exit 1 ;;
          esac

          OUT="/tmp/hermes-data.tar.gz"
          SNAP="/tmp/hermes-snapshot"
          WXOUT="/tmp/weixin-credentials.tar.gz"
          WXENC="/tmp/weixin-credentials.enc"
          WXENV="/tmp/weixin.env"
          WXENVENC="/tmp/weixin-env.enc"

          rm -f "$OUT" "$WXOUT" "$WXENC" "$WXENV" "$WXENVENC"
          rm -rf "$SNAP"
          mkdir -p "$SNAP/.hermes"

          success=0

          for attempt in 1 2 3; do
            rm -rf "$SNAP/.hermes"
            mkdir -p "$SNAP/.hermes"

            if rsync -a \
              --exclude='.env' \
              --exclude='auth.json' \
              --exclude='state.db' \
              --exclude='state.db-wal' \
              --exclude='state.db-shm' \
              --exclude='weixin/accounts/' \
              "$HOME/.hermes/" \
              "$SNAP/.hermes/"; then
              success=1
              break
            fi

            sleep 2
          done

          if [ "$success" -ne 1 ]; then
            rm -rf "$SNAP"
            exit 1
          fi

          if [ -f "$HOME/.hermes/state.db" ]; then
            python3 - "$HOME/.hermes/state.db" "$SNAP/.hermes/state.db" <<'PY'
          import sqlite3
          import sys

          source = sqlite3.connect(sys.argv[1], timeout=30)
          target = sqlite3.connect(sys.argv[2], timeout=30)

          try:
              source.backup(target, pages=100, sleep=0.25)
              target.commit()
          finally:
              target.close()
              source.close()
          PY
          fi

          # Weixin credentials contain a login token. The repository is public, so
          # never place these credentials in a plain artifact. Encrypt them using
          # a key derived from the existing GitHub secret TAILSCALE_AUTH_KEY.
          if [ -d "$HOME/.hermes/weixin/accounts" ] && find "$HOME/.hermes/weixin/accounts" -type f -print -quit | grep -q .; then
            tar -czf "$WXOUT" -C "$HOME/.hermes" weixin/accounts
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass env:WEIXIN_BACKUP_KEY \
              -in "$WXOUT" -out "$WXENC"
            cp "$WXENC" "$SNAP/weixin-credentials.enc"
          fi

          if [ ! -f "$HOME/.hermes/.env" ]; then
            echo "ERROR: Hermes .env is missing; refusing to create a backup." >&2
            exit 1
          fi

          grep -E '^WEIXIN_(ACCOUNT_ID|TOKEN|BASE_URL|CDN_BASE_URL|DM_POLICY|ALLOW_ALL_USERS|ALLOWED_USERS|GROUP_POLICY|GROUP_ALLOWED_USERS|HOME_CHANNEL|HOME_CHANNEL_NAME)=' \
            "$HOME/.hermes/.env" > "$WXENV" || true
          grep -q '^WEIXIN_ACCOUNT_ID=.[^[:space:]]*' "$WXENV" || { echo "ERROR: WEIXIN_ACCOUNT_ID missing; refusing backup." >&2; exit 1; }
          grep -q '^WEIXIN_TOKEN=.[^[:space:]]*' "$WXENV" || { echo "ERROR: WEIXIN_TOKEN missing; refusing backup." >&2; exit 1; }

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:WEIXIN_BACKUP_KEY \
            -in "$WXENV" -out "$WXENVENC"
          cp "$WXENVENC" "$SNAP/weixin-env.enc"

          printf 'state=%s\nrun_id=%s\ncreated_at=%s\n' \
            "$STATE" "${GITHUB_RUN_ID:-unknown}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$SNAP/state-manifest"

          TAR_ITEMS=(.hermes state-manifest)
          [ -f "$SNAP/weixin-credentials.enc" ] && TAR_ITEMS+=(weixin-credentials.enc)
          [ -f "$SNAP/weixin-env.enc" ] && TAR_ITEMS+=(weixin-env.enc)
          tar -czf "$OUT" -C "$SNAP" "${TAR_ITEMS[@]}"

          rm -rf "$SNAP"
          rm -f "$WXOUT" "$WXENC" "$WXENV" "$WXENVENC"

          test -s "$OUT"
          EOF

          chmod +x "$HOME/save-hermes.sh"
          printf '%s' "$WEIXIN_BACKUP_KEY" > "$HOME/.weixin-backup-key"
          chmod 600 "$HOME/.weixin-backup-key"

      - name: Start Dashboard
        run: |
          nohup hermes dashboard \
            --host 0.0.0.0 \
            --port 9119 \
            --no-open \
            > "$HOME/hermes-dashboard.log" 2>&1 &
          sleep 10
          echo "Hermes Dashboard started."
          echo "Tailscale IP: $(sudo tailscale ip -4)"

      - name: Prepare SSH Weixin setup
        if: ${{ inputs.pairing_mode == 'pair' }}
        run: |
          cat > "$HOME/weixin-setup.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          HERMES_HOME="$HOME/.hermes"
          AGENT_DIR="$HERMES_HOME/hermes-agent"

          echo "=== Hermes Weixin 首次设置 ==="
          echo ""
          echo "第一步：下面将显示微信二维码，请用微信扫码。"
          echo "扫码成功后会立即保存微信登录状态，不等待。"
          echo ""

          rm -f /tmp/weixin_qr_saved /tmp/weixin_pairing_saved /tmp/weixin_login_result.json

          cd "$AGENT_DIR"
          ./venv/bin/python - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path
          from gateway.platforms.weixin import qr_login

          result = asyncio.run(
              qr_login(os.path.expanduser("~/.hermes"), timeout_seconds=480)
          )
          if not result:
              raise SystemExit("Weixin QR login did not complete.")
          Path("/tmp/weixin_login_result.json").write_text(
              json.dumps(result, ensure_ascii=False), encoding="utf-8"
          )
          PY

          ACCOUNT_ID=$(python3 -c 'import json; print(json.load(open("/tmp/weixin_login_result.json"))["account_id"])')
          TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/weixin_login_result.json"))["token"])')
          BASE_URL=$(python3 -c 'import json; print(json.load(open("/tmp/weixin_login_result.json")).get("base_url", ""))')
          USER_ID=$(python3 -c 'import json; print(json.load(open("/tmp/weixin_login_result.json")).get("user_id", ""))')

          {
            echo 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin'
            echo 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=hermes123456'
            printf 'WEIXIN_ACCOUNT_ID=%s\n' "$ACCOUNT_ID"
            printf 'WEIXIN_TOKEN=%s\n' "$TOKEN"
            [ -n "$BASE_URL" ] && printf 'WEIXIN_BASE_URL=%s\n' "$BASE_URL"
            echo 'WEIXIN_CDN_BASE_URL=https://novac2c.cdn.weixin.qq.com/c2c'
            echo 'WEIXIN_DM_POLICY=pairing'
            echo 'WEIXIN_ALLOW_ALL_USERS=false'
            echo 'WEIXIN_ALLOWED_USERS='
            echo 'WEIXIN_GROUP_POLICY=disabled'
            echo 'WEIXIN_GROUP_ALLOWED_USERS='
            [ -n "$USER_ID" ] && printf 'WEIXIN_HOME_CHANNEL=%s\n' "$USER_ID"
          } > "$HERMES_HOME/.env"
          chmod 600 "$HERMES_HOME/.env"
          rm -f /tmp/weixin_login_result.json

          echo ""
          echo "=== 微信扫码登录成功 ==="
          echo "立即保存微信登录凭据..."
          "$HOME/save-hermes.sh" pair-pending
          touch /tmp/weixin_qr_saved
          echo "微信登录状态已立即保存。"

          echo ""
          echo "启动 Hermes Gateway..."
          rm -f "$HOME/hermes-gateway.log" "$HOME/hermes-gateway.pid"
          nohup hermes gateway run > "$HOME/hermes-gateway.log" 2>&1 &
          echo $! > "$HOME/hermes-gateway.pid"
          sleep 15
          PID=$(cat "$HOME/hermes-gateway.pid")
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "ERROR: Hermes Gateway exited during startup."
            cat "$HOME/hermes-gateway.log" || true
            exit 1
          fi
          if grep -Eiq 'Weixin startup failed|WEIXIN_TOKEN is required|WEIXIN_ACCOUNT_ID is required|Traceback \(most recent call last\)' "$HOME/hermes-gateway.log"; then
            echo "ERROR: Hermes Gateway Weixin initialization failed."
            cat "$HOME/hermes-gateway.log" || true
            exit 1
          fi
          echo "Hermes Gateway 已启动。"

          echo ""
          echo "第二步：现在用微信给 Hermes 机器人发送一条消息。"
          echo "等待微信产生配对请求..."

          FOUND=0
          for i in $(seq 1 180); do
            PAIRING_DIR="$HERMES_HOME/platforms/pairing"
            [ -d "$PAIRING_DIR" ] || PAIRING_DIR="$HERMES_HOME/pairing"
            if [ -s "$PAIRING_DIR/weixin-pending.json" ]; then
              FOUND=1
              break
            fi
            sleep 2
          done
          if [ "$FOUND" -ne 1 ]; then
            echo "ERROR: 6 分钟内没有检测到微信配对请求。"
            exit 1
          fi

          echo ""
          echo "=== 检测到微信配对请求 ==="
          echo "请查看微信中的 8 位配对码，然后在这里输入。"
          read -r -p "请输入 8 位配对码: " CODE
          if ! printf '%s' "$CODE" | grep -Eq '^[A-Za-z0-9]{8}$'; then
            echo "ERROR: 配对码必须是 8 位字母/数字。"
            exit 1
          fi

          hermes pairing approve weixin "$CODE"

          PAIRING_DIR="$HERMES_HOME/platforms/pairing"
          [ -d "$PAIRING_DIR" ] || PAIRING_DIR="$HERMES_HOME/pairing"
          if [ ! -s "$PAIRING_DIR/weixin-approved.json" ]; then
            echo "ERROR: 配对批准文件没有生成。"
            exit 1
          fi

          echo ""
          echo "=== 微信配对完成 ==="
          echo "立即保存已批准的配对状态..."
          "$HOME/save-hermes.sh" approved
          touch /tmp/weixin_pairing_saved
          echo "微信登录 + 配对状态已经立即保存。"
          echo "=== 首次微信设置完成 ==="
          EOF

          chmod +x "$HOME/weixin-setup.sh"

          echo ""
          echo "=== Tailscale SSH 微信首次设置 ==="
          echo "请使用 Tailscale SSH 登录后，只运行一次："
          echo ""
          echo "ssh $(whoami)@$(sudo tailscale ip -4)"
          echo ""
          echo "登录后运行："
          echo "bash ~/weixin-setup.sh"
          echo ""
          echo "扫码完成后会自动保存；配对完成后也会自动保存。"

      - name: Start Hermes Gateway (normal mode)
        if: ${{ inputs.pairing_mode != 'pair' }}
        run: |
          set -e
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"

          if ! grep -q '^WEIXIN_ACCOUNT_ID=' "$HOME/.hermes/.env"; then
            echo "ERROR: WEIXIN_ACCOUNT_ID was not restored. The Weixin login data is missing."
            exit 1
          fi
          if ! grep -q '^WEIXIN_TOKEN=' "$HOME/.hermes/.env"; then
            echo "ERROR: WEIXIN_TOKEN was not restored. The Weixin login token is missing."
            exit 1
          fi

          rm -f "$HOME/hermes-gateway.log" "$HOME/hermes-gateway.pid"
          nohup hermes gateway run > "$HOME/hermes-gateway.log" 2>&1 &
          echo $! > "$HOME/hermes-gateway.pid"
          sleep 15

          PID=$(cat "$HOME/hermes-gateway.pid")
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "ERROR: Hermes Gateway exited during startup."
            cat "$HOME/hermes-gateway.log" || true
            exit 1
          fi
          if grep -Eiq 'Weixin startup failed|WEIXIN_TOKEN is required|WEIXIN_ACCOUNT_ID is required|Traceback \(most recent call last\)' "$HOME/hermes-gateway.log"; then
            echo "ERROR: Hermes Gateway started but Weixin initialization failed."
            cat "$HOME/hermes-gateway.log" || true
            exit 1
          fi

          echo "Hermes Gateway is running."
          echo "Weixin credentials restored and gateway process is alive."

      - name: Wait for QR login save
        if: ${{ inputs.pairing_mode == 'pair' }}
        run: |
          set -e
          echo "等待 SSH 中扫码完成并立即保存..."
          for i in $(seq 1 360); do
            if [ -f /tmp/weixin_qr_saved ]; then
              echo "=== 微信扫码登录确认完成 ==="
              echo "微信登录状态已保存，立即进入下一步。"
              break
            fi
            sleep 2
          done
          test -f /tmp/weixin_qr_saved

      - name: Upload QR login save immediately
        if: ${{ inputs.pairing_mode == 'pair' }}
        id: upload_qr_login_save
        uses: actions/upload-artifact@v4
        with:
          name: hermes-persistent-data-${{ github.run_id }}-weixin-login
          path: /tmp/hermes-data.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Wait for pairing save
        if: ${{ inputs.pairing_mode == 'pair' }}
        run: |
          set -e
          echo "等待 SSH 中微信配对完成并立即保存..."
          for i in $(seq 1 360); do
            if [ -f /tmp/weixin_pairing_saved ]; then
              echo "=== 微信配对确认完成 ==="
              echo "已批准的配对状态已保存，立即进入下一步。"
              break
            fi
            sleep 2
          done
          test -f /tmp/weixin_pairing_saved

      - name: Upload pairing save immediately
        if: ${{ inputs.pairing_mode == 'pair' }}
        id: upload_pairing_save_immediate
        uses: actions/upload-artifact@v4
        with:
          name: hermes-approved-${{ github.run_id }}-initial
          path: /tmp/hermes-data.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Confirm initial Weixin setup
        if: ${{ inputs.pairing_mode == 'pair' }}
        run: |
          test -n "${{ steps.upload_qr_login_save.outputs.artifact-id }}"
          test -n "${{ steps.upload_pairing_save_immediate.outputs.artifact-id }}"
          echo "微信扫码登录已保存。"
          echo "微信配对已批准并立即保存。"
          echo "首次微信设置完成，后续直接使用 normal 模式。"
          exit 0

      - name: Approve Weixin pairing code (legacy normal mode)
        if: ${{ inputs.pairing_mode == 'normal' && inputs.pairing_code != '' }}
        run: |
          set -e
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          CODE="${{ inputs.pairing_code }}"
          if ! printf '%s' "$CODE" | grep -Eq '^[A-Za-z0-9]{8}$'; then
            echo "ERROR: pairing_code must be exactly 8 letters/numbers."
            exit 1
          fi
          hermes pairing approve weixin "$CODE"
          echo "Weixin pairing approval completed."

      - name: Verify pairing approval (legacy normal mode)
        if: ${{ inputs.pairing_mode == 'normal' && inputs.pairing_code != '' }}
        run: |
          set -e
          PAIRING_DIR="$HOME/.hermes/platforms/pairing"
          [ -d "$PAIRING_DIR" ] || PAIRING_DIR="$HOME/.hermes/pairing"
          if [ ! -s "$PAIRING_DIR/weixin-approved.json" ]; then
            echo "ERROR: Weixin approval file was not created."
            exit 1
          fi
          echo "Weixin pairing approval is present."

      - name: Save approved pairing state (legacy normal mode)
        if: ${{ inputs.pairing_mode == 'normal' && inputs.pairing_code != '' }}
        run: |
          "$HOME/save-hermes.sh" approved

      - name: Upload approved pairing state (legacy normal mode)
        if: ${{ inputs.pairing_mode == 'normal' && inputs.pairing_code != '' }}
        id: upload_approved_pairing
        uses: actions/upload-artifact@v4
        with:
          name: hermes-approved-${{ github.run_id }}-initial
          path: /tmp/hermes-data.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Confirm approved pairing artifact (legacy normal mode)
        if: ${{ inputs.pairing_mode == 'normal' && inputs.pairing_code != '' }}
        run: |
