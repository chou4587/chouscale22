# Tailscale Exit Handoff Test
# Created: 2026-09-07 16:39 (UTC+8)
# Total lines: 643

name: Tailscale Exit Handoff Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: hermes-exit-handoff-test
  cancel-in-progress: false

jobs:
  exit-node-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --advertise-exit-node \
            --accept-dns=false \
            --hostname=github-exit-test

      - name: Enable forwarding and NAT
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1 >/dev/null
          sudo sysctl -w net.ipv6.conf.all.forwarding=1 >/dev/null
          IFACE=$(ip route | awk '/default/ {print $5; exit}')
          sudo iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
          sudo iptables -A FORWARD -i tailscale0 -j ACCEPT
          sudo iptables -A FORWARD -o tailscale0 -j ACCEPT

      - name: Install Hermes
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          hermes --version >/dev/null

      - name: Restore Hermes data
        env:
          GH_TOKEN: ${{ github.token }}
          WEIXIN_BACKUP_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          ID=$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '
                .artifacts[]
                | select(
                    .expired == false
                    and (
                      .name == "hermes-persistent-data"
                      or (.name | startswith("hermes-persistent-data-"))
                    )
                  )
                | [.created_at, .id]
                | @tsv
              ' |
            sort |
            tail -n 1 |
            cut -f 2
          )

          if [ -n "$ID" ]; then
            rm -rf /tmp/hermes-restore
            mkdir -p /tmp/hermes-restore

            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" \
              > /tmp/hermes.zip

            unzip -q /tmp/hermes.zip -d /tmp/hermes-restore

            if [ -f /tmp/hermes-restore/hermes-data.tar.gz ]; then
              tar -xzf /tmp/hermes-restore/hermes-data.tar.gz -C "$HOME"
            fi

            rm -f "$HOME/.hermes/.env"
            rm -f "$HOME/.hermes/auth.json"

            # Weixin credentials are restored separately in encrypted form.
            if [ -f /tmp/hermes-restore/weixin-credentials.enc ]; then
              WEIXIN_BACKUP_KEY="$WEIXIN_BACKUP_KEY" openssl enc -d -aes-256-cbc -pbkdf2 \
                -pass env:WEIXIN_BACKUP_KEY \
                -in /tmp/hermes-restore/weixin-credentials.enc \
                -out /tmp/weixin-credentials.tar.gz
              tar -xzf /tmp/weixin-credentials.tar.gz -C "$HOME"
              rm -f /tmp/weixin-credentials.tar.gz
            fi

            if [ -f /tmp/hermes-restore/weixin-env.enc ]; then
              WEIXIN_BACKUP_KEY="$WEIXIN_BACKUP_KEY" openssl enc -d -aes-256-cbc -pbkdf2 \
                -pass env:WEIXIN_BACKUP_KEY \
                -in /tmp/hermes-restore/weixin-env.enc \
                -out /tmp/weixin.env
            fi

            rm -rf /tmp/hermes-restore
            rm -f /tmp/hermes.zip
          fi

      - name: Install Dashboard
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          cd "$HOME/.hermes/hermes-agent"
          uv pip install --python ./venv/bin/python -e ".[web,pty]" >/dev/null 2>&1

      - name: Configure Hermes
        run: |
          mkdir -p "$HOME/.hermes"

          cat > "$HOME/.hermes/.env" <<'EOF'
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=hermes123456
          EOF

          if [ -f /tmp/weixin.env ]; then
            cat /tmp/weixin.env >> "$HOME/.hermes/.env"
            rm -f /tmp/weixin.env
          fi

          chmod 600 "$HOME/.hermes/.env"

      - name: Install save tools
        env:
          WEIXIN_BACKUP_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq rsync
          fi

          cat > "$HOME/save-hermes.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          export WEIXIN_BACKUP_KEY="$(cat "$HOME/.weixin-backup-key")"

          OUT="/tmp/hermes-data.tar.gz"
          SNAP="/tmp/hermes-snapshot"
          WXOUT="/tmp/weixin-credentials.tar.gz"
          WXENC="/tmp/weixin-credentials.enc"
          WXENV="/tmp/weixin.env"
          WXENVENC="/tmp/weixin-env.enc"

          rm -f "$OUT" "$WXOUT" "$WXENC" "$WXENV" "$WXENVENC"
          rm -rf "$SNAP"
          mkdir -p "$SNAP/.hermes"

          success=0

          for attempt in 1 2 3; do
            rm -rf "$SNAP/.hermes"
            mkdir -p "$SNAP/.hermes"

            if rsync -a \
              --exclude='.env' \
              --exclude='auth.json' \
              --exclude='state.db' \
              --exclude='state.db-wal' \
              --exclude='state.db-shm' \
              --exclude='weixin/accounts/' \
              "$HOME/.hermes/" \
              "$SNAP/.hermes/"; then
              success=1
              break
            fi

            sleep 2
          done

          if [ "$success" -ne 1 ]; then
            rm -rf "$SNAP"
            exit 1
          fi

          if [ -f "$HOME/.hermes/state.db" ]; then
            python3 - "$HOME/.hermes/state.db" "$SNAP/.hermes/state.db" <<'PY'
          import sqlite3
          import sys

          source = sqlite3.connect(sys.argv[1], timeout=30)
          target = sqlite3.connect(sys.argv[2], timeout=30)

          try:
              source.backup(target, pages=100, sleep=0.25)
              target.commit()
          finally:
              target.close()
              source.close()
          PY
          fi

          # Weixin credentials contain a login token. The repository is public, so
          # never place these credentials in a plain artifact. Encrypt them using
          # a key derived from the existing GitHub secret TAILSCALE_AUTH_KEY.
          if [ -d "$HOME/.hermes/weixin/accounts" ] && find "$HOME/.hermes/weixin/accounts" -type f -print -quit | grep -q .; then
            tar -czf "$WXOUT" -C "$HOME/.hermes" weixin/accounts
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -pass env:WEIXIN_BACKUP_KEY \
              -in "$WXOUT" -out "$WXENC"
            cp "$WXENC" "$SNAP/weixin-credentials.enc"
          fi

          if [ -f "$HOME/.hermes/.env" ]; then
            grep -E '^WEIXIN_(ACCOUNT_ID|TOKEN|BASE_URL|CDN_BASE_URL|DM_POLICY|ALLOW_ALL_USERS|ALLOWED_USERS|GROUP_POLICY|GROUP_ALLOWED_USERS|HOME_CHANNEL|HOME_CHANNEL_NAME)=' \
              "$HOME/.hermes/.env" > "$WXENV" || true
            if [ -s "$WXENV" ]; then
              openssl enc -aes-256-cbc -pbkdf2 -salt \
                -pass env:WEIXIN_BACKUP_KEY \
                -in "$WXENV" -out "$WXENVENC"
              cp "$WXENVENC" "$SNAP/weixin-env.enc"
            fi
          fi

          TAR_ITEMS=(.hermes)
          [ -f "$SNAP/weixin-credentials.enc" ] && TAR_ITEMS+=(weixin-credentials.enc)
          [ -f "$SNAP/weixin-env.enc" ] && TAR_ITEMS+=(weixin-env.enc)
          tar -czf "$OUT" -C "$SNAP" "${TAR_ITEMS[@]}"

          rm -rf "$SNAP"
          rm -f "$WXOUT" "$WXENC" "$WXENV" "$WXENVENC"

          test -s "$OUT"
          EOF

          chmod +x "$HOME/save-hermes.sh"
          printf '%s' "$WEIXIN_BACKUP_KEY" > "$HOME/.weixin-backup-key"
          chmod 600 "$HOME/.weixin-backup-key"

      - name: Start Dashboard
        run: |
          nohup hermes dashboard \
            --host 0.0.0.0 \
            --port 9119 \
            --no-open \
            > "$HOME/hermes-dashboard.log" 2>&1 &
          sleep 10
          echo "Hermes Dashboard started."
          echo "Tailscale IP: $(sudo tailscale ip -4)"

      - name: Start Hermes Gateway
        run: |
          if grep -q '^WEIXIN_ACCOUNT_ID=' "$HOME/.hermes/.env"; then
            nohup hermes gateway > /dev/null 2>&1 &
            sleep 5
          fi

      - name: Wait 30 minutes - Save 1
        run: sleep 1800

      - name: Prepare save 1
        id: prepare_save_1
        continue-on-error: true
        run: |
          "$HOME/save-hermes.sh"

      - name: Upload save 1
        id: upload_save_1
        if: steps.prepare_save_1.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hermes-persistent-data-${{ github.run_id }}-01
          path: /tmp/hermes-data.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup after save 1
        if: steps.upload_save_1.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$HOME/cleanup-hermes-artifacts.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          CURRENT_ID="${1:-}"

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '
              .artifacts[]
              | select(
                  .expired == false
                  and (
                    .name == "hermes-persistent-data"
                    or (.name | startswith("hermes-persistent-data-"))
                  )
                )
              | [.created_at, .id]
              | @tsv
            ' |
          sort |
          while IFS=$'\t' read -r CREATED ID; do
            if [ "$ID" != "$CURRENT_ID" ]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" \
                >/dev/null 2>&1 || true
            fi
          done
          EOF

          chmod +x "$HOME/cleanup-hermes-artifacts.sh"
          "$HOME/cleanup-hermes-artifacts.sh" \
            "${{ steps.upload_save_1.outputs.artifact-id }}"

