        uses: actions/upload-artifact@v4
        with:
          name: hermes-persistent-data
          path: /tmp/hermes-data.tar.gz
          overwrite: true
          retention-days: 90

      - name: Graceful logout
        if: always()
        run: |
          sudo tailscale logout || true
