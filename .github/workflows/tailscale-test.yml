name: Tailscale Exit Handoff Test

on:
  workflow_dispatch:

jobs:
  exit-node-test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --advertise-exit-node \
            --accept-dns=false \
            --hostname=github-exit-test

      - name: Enable forwarding and NAT
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

          IFACE=$(ip route | grep default | awk '{print $5}' | head -1)

          sudo iptables -t nat -A POSTROUTING \
            -o "$IFACE" \
            -j MASQUERADE

          sudo iptables -A FORWARD \
            -i tailscale0 \
            -j ACCEPT

          sudo iptables -A FORWARD \
            -o tailscale0 \
            -j ACCEPT

      - name: Install Hermes
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash

          export PATH="$HOME/.local/bin:$PATH"

          hermes --version

      - name: Install uv and Hermes Web Dashboard
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

          export PATH="$HOME/.local/bin:$PATH"

          cd "$HOME/.hermes/hermes-agent"
          uv pip install --system -e ".[web,pty]"
      - name: Configure Hermes Dashboard
        run: |
          mkdir -p "$HOME/.hermes"

          cat >> "$HOME/.hermes/.env" <<'EOF'
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=hermes123456
          EOF

          chmod 600 "$HOME/.hermes/.env"

      - name: Start Hermes Dashboard
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          nohup hermes dashboard \
            --host 0.0.0.0 \
            --port 9119 \
            --no-open \
            > "$HOME/hermes-dashboard.log" 2>&1 &

          sleep 10

          echo "===== Hermes Dashboard ====="
          cat "$HOME/hermes-dashboard.log" || true

          echo "===== Tailscale IP ====="
          sudo tailscale ip -4

      - name: Keep alive for 5 hours 47 minutes
        run: |
          echo "Tailscale Exit Node started."
          echo "Hermes Dashboard started on port 9119."
          echo "Running for 5 hours 47 minutes."

          sleep 20820

      - name: Graceful logout
        if: always()
        run: |
          echo "Stopping Tailscale Exit Node..."
          sudo tailscale logout || true
          echo "Tailscale Exit Node stopped."
