        if: steps.prepare_save_1.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-approved-${{ github.run_id }}-01
          path: /tmp/hermes-data.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup after save 1
        if: steps.upload_save_1.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$HOME/cleanup-hermes-artifacts.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          CURRENT_ID="${1:-}"

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '
              .artifacts[]
              | select(
                  .expired == false
                  and (
                    (.name | startswith("hermes-approved-"))
                    or (.name | startswith("hermes-pair-pending-"))
                  )
                )
              | [.created_at, .id, .name]
              | @tsv
            ' |
          sort -r |
          while IFS=$'\t' read -r CREATED ID NAME; do
            if [ "$ID" != "$CURRENT_ID" ]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" \
                >/dev/null 2>&1 || true
            fi
          done
          EOF

          chmod +x "$HOME/cleanup-hermes-artifacts.sh"
          "$HOME/cleanup-hermes-artifacts.sh" \
            "${{ steps.upload_save_1.outputs.artifact-id }}"

