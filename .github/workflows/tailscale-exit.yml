name: Tailscale Exit Node

on:
  workflow_dispatch:

jobs:
  exit-node:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale Exit Node
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --advertise-exit-node \
            --accept-dns=false \
            --hostname=github-exit-node

      - name: Enable IP forwarding and NAT
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo sysctl -w net.ipv6.conf.all.forwarding=1

          IFACE=$(ip route | grep default | awk '{print $5}')

          echo "Internet interface: $IFACE"

          sudo iptables -t nat -A POSTROUTING -o $IFACE -j MASQUERADE
          sudo iptables -A FORWARD -i tailscale0 -j ACCEPT
          sudo iptables -A FORWARD -o tailscale0 -j ACCEPT

      - name: Check Tailscale status
        run: |
          sudo tailscale ip
          sudo tailscale status --self

      - name: Keep alive
        run: |
          echo "Tailscale Exit Node running"
          while true
          do
            date
            sudo tailscale status
            sleep 300
          done
