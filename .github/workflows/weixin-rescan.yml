# Hermes Weixin QR Re-login
# Run this only when the Weixin login session is lost/expired.
# Do NOT run it while Tailscale Exit Handoff Test is running.

name: Hermes Weixin QR Re-login

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: hermes-exit-handoff-test
  cancel-in-progress: false

jobs:
  weixin-rescan:
    runs-on: ubuntu-latest

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1

      - name: Connect Tailscale
        run: |
          sudo tailscale up \
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} \
            --accept-dns=false \
            --hostname=github-weixin-rescan

      - name: Install Hermes
        run: |
          set -e
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --branch v2026.8.27
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null 2>&1
            export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          fi
          command -v hermes >/dev/null 2>&1
          command -v uv >/dev/null 2>&1
          hermes --version >/dev/null 2>&1
          uv --version >/dev/null 2>&1

      - name: Restore latest Hermes data
        env:
          GH_TOKEN: ${{ github.token }}
          WEIXIN_BACKUP_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          ID=$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '
                .artifacts[]
                | select(
                    .expired == false
                    and (
                      .name == "hermes-persistent-data"
                      or (.name | startswith("hermes-persistent-data-"))
                    )
                  )
                | [.created_at, .id]
                | @tsv
              ' |
            sort |
            tail -n 1 |
            cut -f 2
          )

          if [ -z "$ID" ]; then
            echo "No previous Hermes backup; continuing with a fresh Hermes installation."
          else
            rm -rf /tmp/hermes-restore
            mkdir -p /tmp/hermes-restore
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/hermes.zip
            unzip -q /tmp/hermes.zip -d /tmp/hermes-restore

            tar -xzf /tmp/hermes-restore/hermes-data.tar.gz -C "$HOME"
            rm -f "$HOME/.hermes/.env"
            rm -f "$HOME/.hermes/auth.json"

            if [ -f /tmp/hermes-restore/weixin-credentials.enc ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 \
                -pass env:WEIXIN_BACKUP_KEY \
                -in /tmp/hermes-restore/weixin-credentials.enc \
                -out /tmp/weixin-credentials.tar.gz
              tar -xzf /tmp/weixin-credentials.tar.gz -C "$HOME"
              rm -f /tmp/weixin-credentials.tar.gz
            fi

            if [ -f /tmp/hermes-restore/weixin-env.enc ]; then
              openssl enc -d -aes-256-cbc -pbkdf2 \
                -pass env:WEIXIN_BACKUP_KEY \
                -in /tmp/hermes-restore/weixin-env.enc \
                -out /tmp/weixin.env
            fi

            rm -rf /tmp/hermes-restore /tmp/hermes.zip
          fi

      - name: Install Weixin dependencies
        run: |
          set -e
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          command -v uv >/dev/null 2>&1
          cd "$HOME/.hermes/hermes-agent"
          uv pip install --python ./venv/bin/python aiohttp cryptography qrcode >/dev/null 2>&1

      - name: QR login
        run: |
          cd "$HOME/.hermes/hermes-agent"
          rm -f /tmp/weixin_login_result.json

          ./venv/bin/python - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path

          from gateway.platforms.weixin import qr_login

          result = asyncio.run(
              qr_login(os.path.expanduser("~/.hermes"), timeout_seconds=480)
          )

          if not result:
              raise SystemExit("Weixin QR login did not complete.")

          Path("/tmp/weixin_login_result.json").write_text(
              json.dumps(result, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Save Weixin configuration
        run: |
          mkdir -p "$HOME/.hermes"

          ACCOUNT_ID=$(python3 -c 'import json; print(json.load(open("/tmp/weixin_login_result.json"))["account_id"])')
          TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/weixin_login_result.json"))["token"])')
          BASE_URL=$(python3 -c 'import json; print(json.load(open("/tmp/weixin_login_result.json")).get("base_url", ""))')
          USER_ID=$(python3 -c 'import json; print(json.load(open("/tmp/weixin_login_result.json")).get("user_id", ""))')

          {
            echo 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin'
            echo 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=hermes123456'
            printf 'WEIXIN_ACCOUNT_ID=%s\n' "$ACCOUNT_ID"
            printf 'WEIXIN_TOKEN=%s\n' "$TOKEN"
            [ -n "$BASE_URL" ] && printf 'WEIXIN_BASE_URL=%s\n' "$BASE_URL"
            echo 'WEIXIN_CDN_BASE_URL=https://novac2c.cdn.weixin.qq.com/c2c'
            echo 'WEIXIN_DM_POLICY=pairing'
            echo 'WEIXIN_ALLOW_ALL_USERS=false'
            echo 'WEIXIN_ALLOWED_USERS='
            echo 'WEIXIN_GROUP_POLICY=disabled'
            echo 'WEIXIN_GROUP_ALLOWED_USERS='
            if [ -n "$USER_ID" ]; then
              printf 'WEIXIN_HOME_CHANNEL=%s\n' "$USER_ID"
            fi
          } > "$HOME/.hermes/.env"

          chmod 600 "$HOME/.hermes/.env"
          rm -f /tmp/weixin_login_result.json

      - name: Create encrypted Weixin backup
        env:
          WEIXIN_BACKUP_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          mkdir -p /tmp/weixin-save

          if [ ! -d "$HOME/.hermes/weixin/accounts" ]; then
            echo "ERROR: Weixin account directory was not created after QR login."
            exit 1
          fi
          if ! find "$HOME/.hermes/weixin/accounts" -type f -print -quit | grep -q .; then
            echo "ERROR: Weixin account directory is empty after QR login."
            exit 1
          fi

          tar -czf /tmp/weixin-save/weixin-credentials.tar.gz \
            -C "$HOME/.hermes" weixin/accounts
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:WEIXIN_BACKUP_KEY \
            -in /tmp/weixin-save/weixin-credentials.tar.gz \
            -out /tmp/weixin-save/weixin-credentials.enc

          grep -q '^WEIXIN_ACCOUNT_ID=.[^[:space:]]*' "$HOME/.hermes/.env" || { echo "ERROR: WEIXIN_ACCOUNT_ID missing."; exit 1; }
          grep -q '^WEIXIN_TOKEN=.[^[:space:]]*' "$HOME/.hermes/.env" || { echo "ERROR: WEIXIN_TOKEN missing."; exit 1; }

          grep -E '^WEIXIN_(ACCOUNT_ID|TOKEN|BASE_URL|CDN_BASE_URL|DM_POLICY|ALLOW_ALL_USERS|ALLOWED_USERS|GROUP_POLICY|GROUP_ALLOWED_USERS|HOME_CHANNEL|HOME_CHANNEL_NAME)=' \
            "$HOME/.hermes/.env" > /tmp/weixin-save/weixin.env

          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:WEIXIN_BACKUP_KEY \
            -in /tmp/weixin-save/weixin.env \
            -out /tmp/weixin-save/weixin-env.enc

          rm -f /tmp/weixin-save/weixin-credentials.tar.gz /tmp/weixin-save/weixin.env

      - name: Build Hermes persistent artifact
        run: |
          mkdir -p /tmp/hermes-snapshot/.hermes

          rsync -a \
            --exclude='.env' \
            --exclude='auth.json' \
            --exclude='state.db' \
            --exclude='state.db-wal' \
            --exclude='state.db-shm' \
            --exclude='weixin/accounts/' \
            "$HOME/.hermes/" \
            /tmp/hermes-snapshot/.hermes/

          if [ -f "$HOME/.hermes/state.db" ]; then
            python3 - \
              "$HOME/.hermes/state.db" \
              "/tmp/hermes-snapshot/.hermes/state.db" <<'PY'
          import sqlite3
          import sys
          source = sqlite3.connect(sys.argv[1], timeout=30)
          target = sqlite3.connect(sys.argv[2], timeout=30)
          try:
              source.backup(target, pages=100, sleep=0.25)
              target.commit()
          finally:
              target.close()
              source.close()
          PY
          fi

          cp /tmp/weixin-save/weixin-credentials.enc /tmp/hermes-snapshot/ 2>/dev/null || true
          cp /tmp/weixin-save/weixin-env.enc /tmp/hermes-snapshot/

          tar -czf /tmp/hermes-data.tar.gz -C /tmp/hermes-snapshot \
            .hermes weixin-credentials.enc weixin-env.enc

          test -s /tmp/hermes-data.tar.gz
          tar -tzf /tmp/hermes-data.tar.gz | grep -q '^weixin-env.enc$'
          tar -tzf /tmp/hermes-data.tar.gz | grep -q '^weixin-credentials.enc$'

      - name: Upload encrypted Hermes backup
        uses: actions/upload-artifact@v4
        with:
          name: hermes-persistent-data-${{ github.run_id }}-weixin-rescan
          path: /tmp/hermes-data.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Cleanup old Hermes backups
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_ID=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "hermes-persistent-data-${{ github.run_id }}-weixin-rescan") | .id' \
            | tail -n 1)

          if [ -z "$CURRENT_ID" ]; then
            echo "No new backup was uploaded; keeping existing Hermes backups."
            exit 0
          fi

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '
              .artifacts[]
              | select(
                  .expired == false
                  and (
                    .name == "hermes-persistent-data"
                    or (.name | startswith("hermes-persistent-data-"))
                  )
                )
              | [.created_at, .id]
              | @tsv
            ' |
          sort |
          while IFS=$'\t' read -r CREATED ID; do
            if [ "$ID" != "$CURRENT_ID" ]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" \
                >/dev/null 2>&1 || true
            fi
          done

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/weixin_login_result.json
          sudo tailscale logout || true
